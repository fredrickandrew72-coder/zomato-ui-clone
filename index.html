<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zomato UI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <h1 class="logo">zomato</h1>
    <input type="text" placeholder="Search for restaurant, cuisine or dish">
    <div class="nav-links">
      <a href="#">Log in</a>
      <a href="#">Sign up</a>
    </div>
  </header>

  <!-- Tabs -->
  <section class="tabs">
    <button>Dining Out</button>
    <button class="active">Delivery</button>
    <button>Nightlife</button>
  </section>

  <!-- Inspiration -->
  <section class="section">
    <h2>Inspiration for your first order</h2>
    <div class="circle-container">
      <div class="circle">
        <img src="biryani.jpg">
        <p>Biryani</p>
      </div>
      <div class="circle">
        <img src="pizza.jpg">
        <p>Pizza</p>
      </div>
      <div class="circle">
        <img src="cake.jpg">
        <p>Cake</p>
      </div>
    </div>
  </section>

  <!-- Top Brands -->
  <section class="section">
    <h2>Top brands for you</h2>
    <div class="circle-container">
      <div class="circle">
        <img src="kfc.jpg">
        <p>KFC</p>
      </div>
      <div class="circle">
        <img src="dosa.jpg">
        <p>South Meals</p>
      </div>
    </div>
  </section>

  <!-- Restaurants -->
  <section class="section">
    <h2>Puducherry Restaurants</h2>

    <div class="card-container">
      <div class="card">
        <img src="kfc.jpg">
        <h3>KFC</h3>
        <p>Burger, Fast Food</p>
        <span>⭐ 4.2 • 12 min</span>
      </div>

      <div class="card">
        <img src="biryani.jpg">
        <h3>Dindigul Thalappakatti</h3>
        <p>Biryani, South Indian</p>
        <span>⭐ 4.1 • 25 min</span>
      </div>

      <div class="card">
        <img src="dosa.jpg">
        <h3>Pure Veg Hotel</h3>
        <p>South Indian</p>
        <span>⭐ 4.3 • 15 min</span>
      </div>
    </div>
  </section>

</body>
</html>
